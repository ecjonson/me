version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

    cooldown:
      default-days: 7
      semver-patch-days: 3

    groups:
      dev-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-patch:
        dependency-type: "production"
        update-types: ["patch"]
      prod-minor:
        dependency-type: "production"
        update-types: ["minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
